      <div>
        <div class="@container">
          <div class="@[480px]:px-4 @[480px]:py-3">

        <p class="text-[#111814] text-base font-normal leading-normal pb-3 pt-1 px-4 text-center">旅の後もキーホルダーからステーションの物語にアクセスできます。</p>
      </div>
      <div>
        <div class="flex px-4 py-3">
          <button

        <div class="h-5 bg-white"></div>
