<html>

    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Plus+Jakarta+Sans%3Awght%40400%3B500%3B700%3B800"

            >

                <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">

        </div>

        <div class="flex w-full grow bg-white @container p-4">
          <div class="w-full gap-1 overflow-hidden bg-white @[480px]:gap-2 aspect-[2/3] rounded-lg flex">
            <div
              class="w-full bg-center bg-no-repeat bg-cover aspect-auto rounded-none flex-1"
              style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAj3B2gpxte-ElQctUpgCNOY2-hDN-YAGRdozArQdNyFZlsz9OCyQ7WhR7IWbHPJvmaL7_PffHQZmNnZM1QKPwFXTMfo6OxyUp3DEkUPrw_8lmsUSiKgSdQaoXukgIe9K-pDeuUMqblKn8U83lVpzAg7vthoX2lP-vbRQaJ31S6_jPyibk4dQdAUOjGFqU9GlDyembfUhGWYgr7YUMqAgnm0M_SFXsnDXuKE3mQpOHMKJwdua32VbauM7BccR7hzM22T8z7zGrg2zPq");'
            ></div>
          </div>
        </div>
        <div class="flex px-4 py-3 justify-center">
          <button
            class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-[#f0f5f2] text-[#101814] text-sm font-bold leading-normal tracking-[0.015em]"
          >
            <span class="truncate">NFCをシミュレート</span>
          </button>
        </div>
      </div>
      <div>

          <a class="just flex flex-1 flex-col items-center justify-end gap-1 rounded-full text-[#101814]" href="#">
            <div class="text-[#101814] flex h-8 items-center justify-center" data-icon="House" data-size="24px" data-weight="fill">
              <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                <path

            </div>

              </svg>

          </a>
          <a class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#5e8d71]" href="#">
            <div class="text-[#5e8d71] flex h-8 items-center justify-center" data-icon="MapTrifold" data-size="24px" data-weight="regular">
              <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                <path
                  d="M228.92,49.69a8,8,0,0,0-6.86-1.45L160.93,63.52,99.58,32.84a8,8,0,0,0-5.52-.6l-64,16A8,8,0,0,0,24,56V200a8,8,0,0,0,9.94,7.76l61.13-15.28,61.35,30.68A8.15,8.15,0,0,0,160,224a8,8,0,0,0,1.94-.24l64-16A8,8,0,0,0,232,200V56A8,8,0,0,0,228.92,49.69ZM104,52.94l48,24V203.06l-48-24ZM40,62.25l48-12v127.5l-48,12Zm176,131.5-48,12V78.25l48-12Z"

          <a class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#5e8d71]" href="#">
            <div class="text-[#5e8d71] flex h-8 items-center justify-center" data-icon="ContactlessPayment" data-size="24px" data-weight="regular">
              <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                <path
                  d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216ZM97.07,100.26a59.33,59.33,0,0,1,0,55.48,8,8,0,1,1-14.14-7.48,42.79,42.79,0,0,0,0-40.52,8,8,0,0,1,14.14-7.48Zm56-32a126.67,126.67,0,0,1,0,119.54A8,8,0,0,1,139,180.23a110.62,110.62,0,0,0,0-104.46,8,8,0,0,1,14.12-7.54Zm-28,16a93,93,0,0,1,0,87.52,8,8,0,1,1-14.12-7.52,77,77,0,0,0,0-72.48,8,8,0,1,1,14.12-7.52Z"

          </a>
        </div>
        <div class="h-5 bg-white"></div>
      </div>
    </div>
  </body>
</html>
