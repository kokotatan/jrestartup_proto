        <h2 class="text-[#111814] text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5">プロフィール情報</h2>
        <div class="flex items-center gap-4 bg-white px-4 min-h-14">

          <p class="text-[#111814] text-base font-normal leading-normal flex-1 truncate">プロフィール画像</p>
        </div>
        <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
          <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#111814] text-base font-medium leading-normal pb-2">ユーザー名</p>
            <input
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111814] focus:outline-0 focus:ring-0 border-none bg-[#f0f5f2] focus:border-none h-14 placeholder:text-[#5f8c71] p-4 text-base font-normal leading-normal"
              value=""
            />

        </div>
        <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
          <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#111814] text-base font-medium leading-normal pb-2">メールアドレス</p>
            <input

          </div>
        </div>

          <p class="text-[#111814] text-base font-normal leading-normal flex-1 truncate">プッシュ通知</p>
          <div class="shrink-0">
            <label
              class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-[#f0f5f2] p-0.5 has-[:checked]:justify-end has-[:checked]:bg-[#04af48]"

              <input type="checkbox" class="invisible absolute" />
            </label>
          </div>
        </div>
        <div class="flex items-center gap-4 bg-white px-4 min-h-14 justify-between">
          <p class="text-[#111814] text-base font-normal leading-normal flex-1 truncate">メールアラート</p>

              class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-[#f0f5f2] p-0.5 has-[:checked]:justify-end has-[:checked]:bg-[#04af48]"
