<html>
  <head>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Plus+Jakarta+Sans%3Awght%40400%3B500%3B700%3B800"
    />

    <title>Stitch Design</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  </head>
  <body>
    <div
      class="relative flex h-auto min-h-screen w-full flex-col bg-white justify-between group/design-root overflow-x-hidden"
      style='font-family: "Plus Jakarta Sans", "Noto Sans", sans-serif;'
    >
      <div>
        <div class="flex items-center bg-white p-4 pb-2 justify-between">
          <h2 class="text-[#111814] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pl-12 pr-12">LinkCraft</h2>
        </div>
        <h2 class="text-[#111814] tracking-light text-[28px] font-bold leading-tight px-4 text-center pb-3 pt-5">キーホルダーで旅の物語を解き放つ</h2>
        <p class="text-[#111814] text-base font-normal leading-normal pb-3 pt-1 px-4 text-center">キーホルダーをタップして、駅の物語を見つけよう。</p>
        <div class="flex w-full grow bg-white @container p-4">
          <div class="w-full gap-1 overflow-hidden bg-white @[480px]:gap-2 aspect-[2/3] rounded-lg flex">
            <div
              class="w-full bg-center bg-no-repeat bg-cover aspect-auto rounded-none flex-1"
              style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDCxiIxu-8gNxl9fDe1DgybSPXJ0QJF5JanVPSWU0gs4qVyNLyjNI14uQ_YfwZRpAZ1O-VS8VxuDHYl9dOsMGwrfmmezUKSkEJfzps_Pj1q-xNCzG8DbHC5hW_l_7GAWOONqAk2mp2CK6o0PqtxGPGpRRH2qZazH9mXT794X6SJuOPeSVWtXoYN0novsJU0cO9wrra94QsomO89WzSph_xTySxBwSBK3YWFvaeWjXT4_8_oMLpSpK2Lq26ceX0R5abzVFgi91zKoNBp");'
            ></div>
          </div>
        </div>
      </div>
      <div>
        <div class="flex px-4 py-3">
          <button
            class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 flex-1 bg-[#04af48] text-white text-base font-bold leading-normal tracking-[0.015em]"
          >
            <span class="truncate">次へ</span>
          </button>
        </div>
        <div class="h-5 bg-white"></div>
      </div>
    </div>
  </body>
</html>
