<html>
  <head>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Plus+Jakarta+Sans%3Awght%40400%3B500%3B700%3B800"
    />

    <title>Stitch Design</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  </head>
  <body>
    <div
      class="relative flex h-auto min-h-screen w-full flex-col bg-white justify-between group/design-root overflow-x-hidden"
      style='font-family: "Plus Jakarta Sans", "Noto Sans", sans-serif;'
    >
      <div>
        <div class="flex items-center bg-white p-4 pb-2 justify-between">
          <div class="text-[#111814] flex size-12 shrink-0 items-center" data-icon="ArrowLeft" data-size="24px" data-weight="regular">
            <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
              <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
            </svg>
          </div>
          <h2 class="text-[#111814] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">LinkCraft Local Lines</h2>
        </div>
        <h2 class="text-[#111814] tracking-light text-[28px] font-bold leading-tight px-4 text-center pb-3 pt-5">買って、行って、集める</h2>
        <p class="text-[#111814] text-base font-normal leading-normal pb-3 pt-1 px-4 text-center">キーホルダーを買い、駅に行き、ストーリーを集めよう。</p>
      </div>
      <div>
        <div class="flex w-full grow bg-white @container p-4">
          <div class="w-full gap-1 overflow-hidden bg-white @[480px]:gap-2 aspect-[3/2] rounded-lg flex">
            <div
              class="w-full bg-center bg-no-repeat bg-cover aspect-auto rounded-none flex-1"
              style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBBCXZTTfAluoJ24tMPsV8tMweGbMcJqpoza9UYktMxfsiE-C6mDxShEgDaSf9rJuE4RvevC_AFu0uuNw_HwPAILG3El67Sfam712Y688XhIfbhuSTpQWl0enqmCLgZ4giVgTtqyMo8fV1VMe0aRRrLaNUK9s6XGh9vdowq0tRc3H-yykuRurQZ_QRIeo68vIzn1ILKHirrzHv6Mjzr5u_Egj2dxPJiB7KDj2SxFN4ZmllXBH6Fl0EAUtLFIfXLkAhpA6gNb_xuXudZ");'
            ></div>
          </div>
        </div>
        <div class="flex justify-stretch">
          <div class="flex flex-1 gap-3 flex-wrap px-4 py-3 justify-between">
            <button
              class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-[#04af48] text-white text-base font-bold leading-normal tracking-[0.015em]"
            >
              <span class="truncate">次へ</span>
            </button>
            <button
              class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-transparent text-[#111814] text-base font-bold leading-normal tracking-[0.015em]"
            >
              <span class="truncate">スキップ</span>
            </button>
          </div>
        </div>
        <div class="h-5 bg-white"></div>
      </div>
    </div>
  </body>
</html>
